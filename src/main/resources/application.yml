spring:
  application:
    name: search-autocomplete-system
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: autocomplete-aggregator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.study.autocomplete.query
        spring.json.value.default.type: com.study.autocomplete.query.QueryLog

server:
  port: 8080

autocomplete:
  max-prefix-length: 50
  suggestions-per-prefix: 5
  local-cache:
    maximum-size: 50000
    expire-after-write: 60s
  rebuild:
    cron: "0 0 3 * * SUN"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.study.autocomplete: INFO
