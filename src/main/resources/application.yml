spring:
  application:
    name: search-autocomplete-system
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: autocomplete-aggregator
      auto-offset-reset: earliest

server:
  port: 8080

autocomplete:
  max-prefix-length: 50
  suggestions-per-prefix: 5
  local-cache:
    maximum-size: 50000
    expire-after-write: 60s
  rebuild:
    cron: "0 0 3 * * SUN"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.study.autocomplete: INFO
